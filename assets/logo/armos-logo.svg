<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ARMOS logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/>
      <stop offset="1" stop-color="#151B24"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#C9D3E0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#2A3442" stroke-width="2"/>

  <!-- orbital ring -->
  <ellipse cx="256" cy="260" rx="196" ry="78" fill="none" stroke="#4CC2FF" stroke-width="7"
           opacity="0.85" transform="rotate(-22 256 260)" filter="url(#glow)"/>
  <circle cx="418" cy="190" r="8" fill="#4CC2FF"/>

  <!-- A monogram -->
  <path d="M146 388 L256 124 L366 388" fill="none" stroke="url(#a)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 300 L316 300" fill="none" stroke="#4CC2FF" stroke-width="20"
        stroke-linecap="round"/>
</svg>
