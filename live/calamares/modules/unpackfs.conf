---
# Do not unpack squashfs.img with `unsquashfs`: the squashfs-tools shipped in
# the live image cannot read zstd-compressed filesystems, so installation
# fails with "Command 'unsquashfs' returned non-zero exit status 1".
# dmsquash-live already has that image mounted read-only at /run/rootfsbase;
# copy the mounted tree instead (Calamares "file" source uses find + rsync).
unpack:
    -   source: "/run/rootfsbase"
        sourcefs: "file"
        destination: ""
