---
# Calamares 3.4 expects the full GRUB tool set to be declared explicitly.
# With only efiBootLoader set, the bootloader job dies with KeyError 'grubInstall'.
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
installHybridGRUB: false
kernel: /boot/vmlinuz
