---
defaultGroups:
    - users
    - wheel
    - audio
    - video
    - input
    - usb
    - plugdev
    - network
    - lp
    - scanner
    - kvm
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: false
passwordRequirements:
    minLength: 6
    maxLength: 64
    requireNonLetterOrDigit: false
