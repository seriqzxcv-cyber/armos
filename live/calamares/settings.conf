---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
    - id: armos-postinstall
      module: shellprocess
      config: shellprocess-armos.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-openrc
        - grubcfg
        - bootloader
        - shellprocess@armos-postinstall
        - umount
    - show:
        - finished

branding: armos
prompt-install: false
dont-chroot: false
