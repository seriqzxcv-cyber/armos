# ARMOS Portage configuration
# Target: x86_64, generic v2 baseline, OpenRC, XFCE.

COMMON_FLAGS="-O2 -pipe -march=x86-64-v2 -mtune=generic"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j8"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=10 --quiet-build=y"
PORTAGE_NICENESS=10
LC_COLLATE=C

ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"

FEATURES="buildpkg binpkg-multi-instance compress-build-logs"
BINPKG_COMPRESS="zstd"

GRUB_PLATFORMS="efi-64 pc"
CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4_1 sse4_2 popcnt"

USE="X dbus elogind policykit networkmanager bluetooth pulseaudio pipewire \
     vaapi vdpau vulkan opengl jpeg png webp svg pdf mp3 mp4 ffmpeg \
     -gnome -kde -qt5 -systemd"

VIDEO_CARDS="amdgpu intel nouveau radeon vesa fbdev qxl vmware virtualbox"
INPUT_DEVICES="libinput"

LINGUAS="ru en"
L10N="ru en"

# Keep distfiles and binpkgs on the bind-mounted cache.
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
